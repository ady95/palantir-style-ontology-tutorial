[project]
name = "palantir-style-ontology-tutorial"
version = "0.1.0"
description = "「팔란티어식 온톨로지 따라하기」 예제 코드"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.0",
]

[dependency-groups]
# PART 2. 전통적인 온톨로지 (RDF·OWL·SPARQL·SHACL)
semantic = [
    "rdflib>=7.1",
    "owlrl>=7.1",
    "pyshacl>=0.30",
    "owlready2>=0.47",
]
# PART 4~. Mini Ontology Engine
engine = [
    "pydantic>=2.7",
    "pyyaml>=6",
    "psycopg[binary]>=3.2",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pyjwt>=2.8",
]
dev = [
    "pytest>=8",
]
# PART 6~. AI 에이전트 연동 (MCP 서버·클라이언트)
agent = [
    "mcp>=2.3",
]

[tool.uv]
default-groups = ["semantic", "engine", "agent", "dev"]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:Using `httpx` with"]
