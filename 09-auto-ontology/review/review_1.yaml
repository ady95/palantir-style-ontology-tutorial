# =============================================================================
#  37장 전문가 검토 기록 — results37 1회차 초안 (draft_1.yaml · qa_1.json)
#
#  검토자는 세무사 A001. 이 실습에서는 저자가 전문가 역할을 맡았고, 문서에 없던 질문의 답과 Action 수정은
#  손으로 쓴 세무 정의(taxos v0.8.0)를 업무 기준으로 삼아 적었다. 고친 내용은 37_review.py 가 수정 기록으로 남긴다.
#
#  qa:       Q/A 번호 → verdict(answer: 문서에 없던 질문에 답 | fix: 답이나 테스트 조건을 고침 | out_of_scope: 범위 밖)
#  actions:  생성 Action 이름 → decision(approve | modify | keep_active | reject), rename, patches, reason
#            patches: {set|remove|append: 경로, value: 값}  경로는 definition.permission.roles 처럼 점으로
# =============================================================================
reviewer: {id: A001, role: 세무사, type: human}

allow_breaking: >-
  Action 이름은 기존 이름으로 맞췄지만 입력(파라미터) 이름이 바뀐 Action 이 있다.
  호출하는 쪽(에이전트 도구 설명·API 사용 코드)을 함께 고치기로 하고 반영한다.

qa:
  # ---- 문서에 답이 없던 질문 (세무 정의 기준으로 답함)
  Q004: {verdict: answer, answer: "아니요, 할 수 없습니다.", case: {expect: 불가}}   # 시스템이 고객의 담당자를 배정할 수 있나요?
  Q007: {verdict: answer, answer: "아니요, 승인 없이 바로 처리합니다.", case: {expect: 가능}}   # 세무사가 담당자를 배정할 때 승인이 필요한가요?
  Q009: {verdict: out_of_scope, reason: 고객 정보 등록·변경은 이번 범위가 아님}   # 세무사가 고객 정보를 등록하거나 변경할 수 있나요?
  Q010: {verdict: out_of_scope, reason: 고객 정보 등록·변경은 이번 범위가 아님}   # 실무자가 고객 정보를 등록하거나 변경할 수 있나요?
  Q011: {verdict: out_of_scope, reason: 고객 정보 등록·변경은 이번 범위가 아님}   # AI비서가 고객 정보를 등록하거나 변경할 수 있나요?
  Q012: {verdict: out_of_scope, reason: 고객 정보 등록·변경은 이번 범위가 아님}   # 시스템이 고객 정보를 등록하거나 변경할 수 있나요?
  Q014: {verdict: out_of_scope, reason: 고객 정보 등록·변경은 이번 범위가 아님}   # 고객 정보를 등록할 때 승인이 필요한가요?
  Q015: {verdict: out_of_scope, reason: 고객 정보 등록·변경은 이번 범위가 아님}   # 고객 정보를 등록하면 시스템에서 무엇이 바뀌나요?
  Q017: {verdict: answer, answer: "아니요, 할 수 없습니다.", case: {expect: 불가}}   # 실무자가 고객의 위험 등급을 바꿀 수 있나요?
  Q018: {verdict: answer, answer: "아니요, 할 수 없습니다.", case: {expect: 불가}}   # AI비서가 고객의 위험 등급을 바꿀 수 있나요?
  Q019: {verdict: answer, answer: "아니요, 할 수 없습니다.", case: {expect: 불가}}   # 시스템이 고객의 위험 등급을 바꿀 수 있나요?
  Q021: {verdict: answer, answer: "아니요, 승인 없이 바로 처리합니다.", case: {expect: 가능}}   # 세무사가 위험 등급을 변경할 때 승인이 필요한가요?
  Q026: {verdict: answer, answer: "아니요, 할 수 없습니다.", case: {expect: 불가}}   # 시스템이 자료를 요청할 수 있나요?
  Q036: {verdict: answer, answer: "아니요, 승인 없이 바로 처리합니다.", case: {expect: 가능}}   # 세무사가 자료를 요청할 때 승인이 필요한가요?
  Q037: {verdict: answer, answer: "아니요, 승인 없이 바로 처리합니다.", case: {expect: 가능}}   # 실무자가 자료를 요청할 때 승인이 필요한가요?
  Q041: {verdict: answer, answer: "아니요, 할 수 없습니다.", case: {expect: 불가}}   # AI비서가 자료 요청을 취소할 수 있나요?
  Q042: {verdict: answer, answer: "아니요, 할 수 없습니다.", case: {expect: 불가}}   # 시스템이 자료 요청을 취소할 수 있나요?
  Q045: {verdict: answer, answer: "아니요, 승인 없이 바로 처리합니다.", case: {expect: 가능}}   # 자료 요청을 취소할 때 승인이 필요한가요?
  Q053: {verdict: answer, answer: "아니요, 승인 없이 바로 처리합니다.", case: {expect: 가능}}   # 자료 접수를 기록할 때 승인이 필요한가요?
  Q054: {verdict: answer, answer: "접수한 자료가 제출완료가 되고 제출일이 기록됩니다. 자료 접수 이벤트가 나가 필수 자료가 모두 모이면 검토가 자동으로 시작됩니다."}   # 자료 접수를 기록하면 시스템에서 무엇이 바뀌나요?
  Q055: {verdict: answer, answer: "예, 할 수 있습니다.", case: {expect: 가능}}   # 세무사가 신고서 검토를 시작할 수 있나요?
  Q056: {verdict: answer, answer: "예, 할 수 있습니다.", case: {expect: 가능}}   # 실무자가 신고서 검토를 시작할 수 있나요?
  Q057: {verdict: answer, answer: "예, 할 수 있습니다.", case: {expect: 가능}}   # AI비서가 신고서 검토를 시작할 수 있나요?
  Q064: {verdict: answer, answer: "아니요, 승인 없이 바로 처리합니다.", case: {expect: 가능}}   # 검토를 시작하려면 승인이 필요한가요?
