  Q069: {verdict: answer, answer: "아니요, 할 수 없습니다.", case: {expect: 불가}}   # 시스템이 검토 중 자료 부족을 발견하면 신고를 자료수집 단계로 되돌릴 수 있나요?
  Q071: {verdict: answer, answer: "아니요, 승인 없이 바로 처리합니다.", case: {expect: 가능}}   # 세무사가 검토 중인 신고를 자료수집 단계로 되돌릴 때 승인이 필요한가요?
  Q080: {verdict: answer, answer: "아니요, 승인 없이 바로 처리합니다.", case: {expect: 가능}}   # 세무사가 신고 완료 처리를 할 때 승인이 필요한가요?
  Q088: {verdict: answer, answer: "아니요, 승인 없이 바로 처리합니다.", case: {expect: 가능}}   # 세무사가 기한후신고 처리를 할 때 승인이 필요한가요?
  Q094: {verdict: answer, answer: "예, 할 수 있습니다.", case: {expect: 가능, target: TaxReturn}}   # 세무사가 자료를 요청할 수 있나요?
  Q095: {verdict: answer, answer: "아니요, 할 수 없습니다.", case: {expect: 불가, target: TaxReturn}}   # 시스템이 자료를 요청할 수 있나요?
  Q096: {verdict: answer, answer: "아직 요청하지 않은(미요청) 자료가 모두 요청됨으로 바뀌고, 담당자에게 자료요청 업무가 생깁니다."}   # 자료 요청을 발송하면 자료 제출 현황에서 무엇이 바뀌나요?
  Q101: {verdict: answer, answer: "예, 할 수 있습니다.", case: {expect: 가능}}   # 실무자가 문의를 담당자에게 전달할 수 있나요?
