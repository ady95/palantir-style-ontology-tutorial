assign_customer_accountant:
  definition:
    display_name: 고객 담당자 배정
    description: 고객에게 실무자를 배정하거나 기존 담당자를 변경한다. 담당자 변경 시 완료된 담당자배정 업무를 하나 남겨야 하나, 제시된
      문법에는 최초 배정과 변경을 구분한 조건부 객체 생성이 없어 해당 효과를 edits에 표현할 수 없다. 또한 지정한 담당자가 실무자인지
      확인하는 조건을 제시된 값 참조 문법으로 표현할 수 없다.
    target: Customer
    parameters:
      accountant_id:
        type: string
        required: true
        description: 새로 배정할 실무자의 담당자 ID
    preconditions:
    - message: 담당 고객 수가 상한에 도달한 실무자에게 배정할 수 없습니다.
      check:
        function: has_capacity
        args:
          accountant: $params.accountant_id
    - message: 현재 담당자를 다시 배정할 수 없습니다.
      check:
        any:
        - field: accountant_id
          op: is_null
        - field: accountant_id
          op: ne
          value: $params.accountant_id
    permission:
      roles:
      - 세무사
      actor_types:
      - human
    edits:
    - update: target
      set:
        accountant_id: $params.accountant_id
    emits: []
  transitions: []
  task: 고객 담당자 배정
  qa:
  - Q001
  - Q002
  - Q003
  - Q005
  - Q006
  - Q008
  - Q132
  - Q133
  - Q134
  - Q135
register_or_update_customer:
  definition:
    display_name: 고객 정보 등록·변경
    description: 고객 정보를 등록하거나 변경한다.
    target: Customer
    parameters:
      company_name:
        type: string
        required: false
      representative:
        type: string
        required: false
      business_reg_no:
        type: string
        required: false
      business_type:
        type: enum
        values:
        - 개인
        - 법인
        required: true
      vat_type:
        type: enum
        values:
        - 일반과세자
        - 간이과세자
        required: true
      industry:
        type: string
        required: false
      business_status:
        type: enum
        values:
        - 영업
        - 휴업
        - 폐업
        required: false
      risk_level:
        type: enum
        values:
        - 낮음
        - 보통
        - 높음
        required: false
      accountant_id:
        type: string
        required: false
      phone:
        type: string
        required: false
      contracted_at:
        type: date
        required: false
    preconditions:
    - message: 법인 고객은 간이과세자로 등록하거나 변경할 수 없습니다.
      check:
        not:
          all:
          - field: $params.business_type
            op: eq
            value: 법인
          - field: $params.vat_type
            op: eq
            value: 간이과세자
    permission:
      roles: []
      actor_types: []
    edits:
    - update: target
      set:
        company_name: $params.company_name
        representative: $params.representative
        business_reg_no: $params.business_reg_no
        business_type: $params.business_type
        vat_type: $params.vat_type
        industry: $params.industry
        business_status: $params.business_status
        risk_level: $params.risk_level
        accountant_id: $params.accountant_id
        phone: $params.phone
        contracted_at: $params.contracted_at
    emits: []
  transitions: []
  task: 고객 정보 등록·변경
  qa:
  - Q013
change_risk_level:
  definition:
    display_name: 위험 등급 변경
    description: 고객의 위험 등급을 변경하고 이유를 입력받는다. 객체 모델에 변경 이유를 저장할 속성이 없어 이유는 저장할 수 없다.
    target: Customer
    parameters:
      risk_level:
        type: enum
        values:
        - 낮음
        - 보통
        - 높음
        required: true
        description: 변경할 위험 등급
      reason:
        type: string
        required: true
        description: 위험 등급 변경 이유
    preconditions:
    - message: 변경할 등급은 현재 등급과 달라야 합니다.
      check:
        field: risk_level
        op: ne
        value: $params.risk_level
    - message: 변경 이유를 입력해야 합니다.
      check:
        all:
        - field: $params.reason
          op: not_null
        - field: $params.reason
          op: ne
          value: ''
    permission:
      roles:
      - 세무사
      actor_types:
      - human
    edits:
    - update: target
      set:
        risk_level: $params.risk_level
    emits: []
  transitions: []
  task: 위험 등급 변경
  qa:
  - Q016
  - Q020
  - Q022
request_documents:
  definition:
    display_name: 자료 요청
    description: 신고에 필요한 미요청 자료를 고객에게 요청하고 담당 실무자의 자료요청 업무를 생성한다. 같은 신고에 진행중인 자료요청
      업무가 없는지 확인하는 조건은 DocumentSubmission에서 해당 업무 링크에 직접 접근할 수 없어 적용하지 못한다.
    target: DocumentSubmission
    parameters: {}
    preconditions:
    - message: 자료수집중인 신고에서만 자료를 요청할 수 있습니다.
      check:
        field: tax_return.status
        op: eq
        value: 자료수집중
    - message: 휴업 또는 폐업 고객에게는 자료를 요청할 수 없습니다.
      check:
        field: tax_return.customer.business_status
        op: not_in
        value:
        - 휴업
        - 폐업
    - message: 미요청 자료만 요청할 수 있습니다.
      check:
        field: status
        op: eq
        value: 미요청
    permission:
      roles:
      - 세무사
      - 실무자
      - AI비서
      actor_types:
      - human
      - agent
    approval:
      required_if:
        all:
        - field: $actor.role
          op: eq
          value: AI비서
        - field: tax_return.customer.risk_level
          op: eq
          value: 높음
      approver_roles:
      - 세무사
      reason: AI비서의 고위험 고객 자료 요청은 발송 전에 세무사의 승인이 필요합니다.
      expires_in: 24h
    edits:
    - update: target
      set:
        status: 요청됨
        requested_at: $today
    - create: Task
      values:
        customer_id: $target.tax_return.customer_id
        return_id: $target.return_id
        task_type: 자료요청
        assignee_id: $target.tax_return.customer.accountant_id
        status: 대기
        due_date: $target.tax_return.due_date
        created_by: $actor.type
        created_at: $now
    emits: []
  transitions:
  - object_type: DocumentSubmission
    from:
    - 미요청
    to: 요청됨
  task: 자료 요청
  qa:
  - Q023
  - Q024
  - Q025
  - Q027
  - Q028
  - Q029
  - Q030
  - Q031
  - Q032
  - Q033
  - Q034
  - Q035
  - Q038
  - Q090
  - Q091
  - Q092
  - Q093
cancel_document_request:
  definition:
    display_name: 자료 요청 취소
    description: 자료 요청을 미요청 상태로 되돌립니다. DocumentSubmission에서 Task로 연결되는 링크가 없고 취소 사유를
      저장할 속성이 없어 관련 업무 취소와 취소 사유 저장은 표현할 수 없습니다.
    target: DocumentSubmission
    parameters:
      reason:
        type: string
        required: true
        description: 취소 사유
    preconditions:
    - message: 신고가 자료수집중이어야 합니다.
      check:
        field: tax_return.status
        op: eq
        value: 자료수집중
    - message: 요청됨 상태의 자료만 취소할 수 있습니다.
      check:
        field: status
        op: eq
        value: 요청됨
    permission:
      roles:
      - 세무사
      - 실무자
      actor_types:
      - human
    edits:
    - update: target
      set:
        status: 미요청
    emits: []
  transitions:
  - object_type: DocumentSubmission
    from:
    - 요청됨
    to: 미요청
  task: 자료 요청 취소
  qa:
  - Q039
  - Q040
  - Q043
  - Q044
  - Q046
  - Q047
record_document_receipt:
  definition:
    display_name: 자료 접수 기록
    description: 받은 자료의 접수를 기록한다. 종료 상태인 해당없음에서는 접수를 기록할 수 없다.
    target: DocumentSubmission
    parameters: {}
    preconditions:
    - message: 신고가 자료수집중일 때만 자료 접수를 기록할 수 있습니다.
      check:
        field: tax_return.status
        op: eq
        value: 자료수집중
    permission:
      roles:
      - 세무사
      - 실무자
      actor_types:
      - human
    edits:
    - update: target
      set:
        status: 제출완료
        submitted_at: $today
    emits: []
  transitions:
  - object_type: DocumentSubmission
    from:
    - 미요청
    - 요청됨
    to: 제출완료
  task: 자료 접수 기록
  qa:
  - Q048
  - Q049
  - Q050
  - Q051
  - Q052
start_tax_return_review:
  definition:
    display_name: 신고서 검토 시작
    description: 필수 자료가 준비된 신고의 검토를 시작하고 자료요청 업무를 완료한 뒤 담당자에게 신고서검토 업무를 생성한다. 생성할
      업무의 기한은 입력받는다.
    target: TaxReturn
    parameters:
      due_date:
        type: date
        required: true
        description: 생성할 신고서검토 업무의 기한
    preconditions:
    - message: 자료수집중인 신고만 검토를 시작할 수 있습니다.
      check:
        field: status
        op: eq
        value: 자료수집중
    - message: 필요한 자료 유형마다 자료 현황이 등록되어 있어야 합니다.
      check:
        function: documents_registered
        args:
          tax_return: $target.return_id
    - message: 필수 자료가 모두 제출완료 또는 해당없음으로 정리되어야 합니다.
      check:
        none:
          link: submissions
          where:
            field: status
            op: not_in
            value:
            - 제출완료
            - 해당없음
    permission:
      roles:
      - 시스템
      actor_types:
      - system
    edits:
    - update: target
      set:
        status: 검토중
    - update_linked: tasks
      where:
        all:
        - field: task_type
          op: eq
          value: 자료요청
        - field: status
          op: in
          value:
          - 대기
          - 진행중
      set:
        status: 완료
    - create: Task
      values:
        customer_id: $target.customer_id
        return_id: $target.return_id
        task_type: 신고서검토
        assignee_id: $target.customer.accountant_id
        status: 대기
        due_date: $params.due_date
        created_by: system
        created_at: $now
    emits: []
  transitions:
  - object_type: TaxReturn
    from:
    - 자료수집중
    to: 검토중
  - object_type: Task
    from:
    - 대기
    - 진행중
    to: 완료
  task: 신고서 검토 시작
  qa:
  - Q058
  - Q059
  - Q060
  - Q061
  - Q062
  - Q063
  - Q065
return_to_document_collection:
  definition:
    display_name: 자료수집 단계로 되돌리기
    description: 검토 중 자료 부족이나 누락을 발견한 신고를 이유와 함께 자료수집 단계로 되돌리고, 진행 중인 신고서검토 업무를 취소하며
      담당자에게 고객 연락 업무를 생성한다.
    target: TaxReturn
    parameters:
      reason:
        type: string
        required: true
        description: 자료수집 단계로 되돌리는 이유
      assignee_id:
        type: string
        required: true
        description: 고객 연락 업무를 맡을 담당자의 accountant_id
      due_date:
        type: date
        required: true
        description: 고객 연락 업무의 기한
    preconditions:
    - message: 검토 중인 신고만 자료수집 단계로 되돌릴 수 있습니다.
      check:
        field: status
        op: eq
        value: 검토중
    - message: 되돌리는 이유를 남겨야 합니다.
      check:
        all:
        - field: $params.reason
          op: not_null
        - field: $params.reason
          op: ne
          value: ''
    permission:
      roles:
      - 세무사
      actor_types:
      - human
    edits:
    - update: target
      set:
        status: 자료수집중
    - update_linked: tasks
      where:
        all:
        - field: task_type
          op: eq
          value: 신고서검토
        - field: status
          op: eq
          value: 진행중
      set:
        status: 취소
    - create: Task
      values:
        customer_id: $target.customer_id
        return_id: $target.return_id
        task_type: 고객연락
        assignee_id: $params.assignee_id
        status: 대기
        due_date: $params.due_date
        created_by: $actor.type
        created_at: $now
        note: $params.reason
    emits: []
  transitions:
  - object_type: TaxReturn
    from:
    - 검토중
    to: 자료수집중
  - object_type: Task
    from:
    - 진행중
    to: 취소
  task: 자료수집 단계로 되돌리기
  qa:
  - Q063
  - Q066
  - Q070
  - Q072
  - Q114
  - Q119
complete_tax_return:
  definition:
    display_name: 신고 완료 처리
    description: 기한 내 신고를 완료 처리하고 남아 있는 신고서검토 업무를 완료한다.
    target: TaxReturn
    parameters: {}
    preconditions:
    - message: 검토 중인 신고만 완료 처리할 수 있습니다.
      check:
        field: status
        op: eq
        value: 검토중
    - message: 미제출 자료가 없어야 합니다.
      check:
        none:
          link: submissions
          where:
            field: status
            op: in
            value:
            - 미요청
            - 요청됨
    - message: 신고 기한이 지나지 않아야 합니다.
      check:
        field: due_date
        op: gte
        value: $today
    permission:
      roles:
      - 세무사
      actor_types:
      - human
    edits:
    - update: target
      set:
        status: 신고완료
        filed_at: $today
    - update_linked: tasks
      where:
        all:
        - field: task_type
          op: eq
          value: 신고서검토
        - field: status
          op: in
          value:
          - 대기
          - 진행중
      set:
        status: 완료
    emits: []
  transitions:
  - object_type: TaxReturn
    from:
    - 검토중
    to: 신고완료
  - object_type: Task
    from:
    - 대기
    - 진행중
    to: 완료
  task: 신고 완료 처리
  qa:
  - Q073
  - Q074
  - Q075
  - Q076
  - Q077
  - Q078
  - Q079
  - Q081
  - Q120
process_late_filing:
  definition:
    display_name: 기한후신고 처리
    description: 기한이 지난 신고를 기한후신고로 처리하고 남아 있는 신고서검토 업무를 완료한다.
    target: TaxReturn
    parameters: {}
    preconditions:
    - message: 검토 중인 신고만 기한후신고로 처리할 수 있습니다.
      check:
        field: status
        op: eq
        value: 검토중
    - message: 신고 기한이 지나야 기한후신고로 처리할 수 있습니다.
      check:
        field: due_date
        op: lt
        value: $today
    permission:
      roles:
      - 세무사
      actor_types:
      - human
    edits:
    - update: target
      set:
        status: 기한후신고
        filed_at: $today
    - update_linked: tasks
      where:
        all:
        - field: task_type
          op: eq
          value: 신고서검토
        - field: status
          op: in
          value:
          - 대기
          - 진행중
      set:
        status: 완료
    emits: []
  transitions:
  - object_type: TaxReturn
    from:
    - 검토중
    to: 기한후신고
  - object_type: Task
    from:
    - 대기
    - 진행중
    to: 완료
  task: 기한후신고 처리
  qa:
  - Q079
  - Q082
  - Q083
  - Q084
  - Q085
  - Q086
  - Q087
  - Q089
  - Q120
  - Q126
  - Q131
forward_inquiry:
  definition:
    display_name: 문의 전달
    description: 고객 문의를 담당자에게 전달한다. AI비서는 휴업 또는 폐업 고객의 문의와 세액 계산이나 담당자 변경 문의를 전달한다.
      모델에 전달 Function이나 이벤트가 없어 실제 전달 효과는 표현할 수 없다. 담당자 변경 문의를 구분할 속성도 없어 해당 조건을 검증할
      수 없다.
    target: Inquiry
    parameters: {}
    preconditions: []
    permission:
      roles:
      - AI비서
      actor_types:
      - agent
    edits:
    - update: target
      set:
        status: 담당자확인
    emits: []
  transitions:
  - object_type: Inquiry
    from:
    - 접수
    to: 담당자확인
  task: 문의 전달
  qa:
  - Q097
  - Q098
  - Q099
  - Q100
  - Q105
answer_inquiry:
  definition:
    display_name: 문의 답변
    description: 고객 문의에 답변하고 답변 내역을 기록한다.
    target: Inquiry
    parameters:
      answer:
        type: string
        required: true
        description: 고객 문의에 대한 답변 내용
    preconditions:
    - message: AI비서는 세액·가산세 계산 문의에 답변하지 않습니다.
      check:
        any:
        - field: $actor.role
          op: ne
          value: AI비서
        - field: category
          op: ne
          value: 세금계산
    - message: 담당자에게 넘어간 문의는 담당자가 답변해야 합니다.
