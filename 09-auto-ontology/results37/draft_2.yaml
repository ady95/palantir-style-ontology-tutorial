assign_accountant:
  definition:
    display_name: 담당자 배정
    description: 새 고객의 담당자를 배정하거나 기존 담당자를 변경한다. 담당자 변경 시 완료 상태의 담당자배정 업무를 하나 남겨야 하나,
      정의 문법에 조건부 객체 생성 기능이 없어 해당 효과는 표현하지 못한다.
    target: Customer
    parameters:
      accountant:
        type: object
        object_type: Accountant
        required: true
        description: 배정할 실무자
    preconditions:
    - message: 담당 고객 수가 상한 미만인 실무자에게 배정해야 합니다.
      check:
        function: has_capacity
        args:
          accountant: $params.accountant
    - message: 현재 담당자와 다른 담당자를 배정해야 합니다.
      check:
        any:
        - field: accountant_id
          op: is_null
        - field: accountant_id
          op: ne
          value: $params.accountant
    permission:
      roles:
      - 세무사
      actor_types:
      - human
    edits:
    - update: target
      set:
        accountant_id: $params.accountant
    emits: []
  transitions: []
  task: 담당자 배정
  qa:
  - Q001
  - Q002
  - Q003
  - Q005
  - Q006
  - Q008
  - Q125
  - Q126
  - Q127
  - Q128
register_customer:
  definition:
    display_name: 고객 정보 등록
    description: 고객 정보를 등록한다.
    target: Customer
    parameters:
      customer_id:
        type: string
      company_name:
        type: string
      representative:
        type: string
      business_reg_no:
        type: string
      business_type:
        type: enum
        values:
        - 개인
        - 법인
      vat_type:
        type: enum
        values:
        - 일반과세자
        - 간이과세자
      industry:
        type: string
      business_status:
        type: enum
        values:
        - 영업
        - 휴업
        - 폐업
      risk_level:
        type: enum
        values:
        - 낮음
        - 보통
        - 높음
      accountant_id:
        type: string
      phone:
        type: string
      contracted_at:
        type: date
    preconditions:
    - message: 법인 고객은 간이과세자로 등록할 수 없습니다.
      check:
        not:
          all:
          - field: $params.business_type
            op: eq
            value: 법인
          - field: $params.vat_type
            op: eq
            value: 간이과세자
    permission:
      roles: []
      actor_types: []
    edits:
    - create: Customer
      values:
        customer_id: $params.customer_id
        company_name: $params.company_name
        representative: $params.representative
        business_reg_no: $params.business_reg_no
        business_type: $params.business_type
        vat_type: $params.vat_type
        industry: $params.industry
        business_status: $params.business_status
        risk_level: $params.risk_level
        accountant_id: $params.accountant_id
        phone: $params.phone
        contracted_at: $params.contracted_at
    emits: []
  transitions: []
  task: 고객 정보 등록
  qa:
  - Q013
change_risk_level:
  definition:
    display_name: 위험 등급 변경
    description: 고객의 신고 지연 위험 등급을 변경한다. 변경 이유를 기록할 속성이 객체 모델에 없어 이유를 저장할 수 없다.
    target: Customer
    parameters:
      risk_level:
        type: enum
        values:
        - 낮음
        - 보통
        - 높음
        required: true
        description: 변경할 위험 등급
      reason:
        type: string
        required: true
        description: 위험 등급 변경 이유
    preconditions:
    - message: 변경할 등급은 현재 등급과 달라야 합니다.
      check:
        field: risk_level
        op: ne
        value: $params.risk_level
    permission:
      roles:
      - 세무사
      actor_types:
      - human
    edits:
    - update: target
      set:
        risk_level: $params.risk_level
    emits: []
  transitions: []
  task: 위험 등급 변경
  qa:
  - Q016
  - Q017
  - Q018
  - Q019
  - Q020
  - Q022
request_document:
  definition:
    display_name: 자료 요청
    description: 신고에 필요한 자료를 고객에게 요청하고 담당자에게 자료요청 업무를 생성한다. 같은 신고에 대기 또는 진행 중인 자료요청
      업무가 없어야 한다는 조건은 DocumentSubmission에서 해당 업무 링크를 직접 참조할 수 없어 검사하지 못한다.
    target: DocumentSubmission
    parameters: {}
    preconditions:
    - message: 자료수집중인 신고에서만 자료를 요청할 수 있습니다.
      check:
        field: tax_return.status
        op: eq
        value: 자료수집중
    - message: 휴업 또는 폐업 고객에게는 자료를 요청할 수 없습니다.
      check:
        field: tax_return.customer.business_status
        op: not_in
        value:
        - 휴업
        - 폐업
    - message: 아직 요청하지 않은 자료만 요청할 수 있습니다.
      check:
        field: status
        op: eq
        value: 미요청
    permission:
      roles:
      - 세무사
      - 실무자
      - AI비서
      actor_types:
      - human
      - agent
    approval:
      required_if:
        all:
        - field: $actor.role
          op: eq
          value: AI비서
        - field: tax_return.customer.risk_level
          op: eq
          value: 높음
      approver_roles:
      - 세무사
      reason: AI비서가 고위험 고객에게 자료를 요청하려면 발송 전 세무사 승인이 필요합니다.
      expires_in: 24h
    edits:
    - update: target
      set:
        status: 요청됨
    - create: Task
      values:
        customer_id: $target.tax_return.customer_id
        return_id: $target.return_id
        task_type: 자료요청
        assignee_id: $target.tax_return.customer.accountant_id
        status: 대기
        due_date: $target.tax_return.due_date
        created_by: $actor.type
        created_at: $now
    emits: []
  transitions:
  - object_type: DocumentSubmission
    from:
    - 미요청
    to: 요청됨
  task: 자료 요청
  qa:
  - Q023
  - Q024
  - Q025
  - Q027
  - Q028
  - Q029
  - Q030
  - Q031
  - Q032
  - Q033
  - Q034
  - Q035
  - Q038
  - Q088
  - Q089
  - Q090
  - Q091
cancel_document_request:
  definition:
    display_name: 자료 요청 취소
    description: 잘못 보낸 자료 요청을 취소한다. 자료 제출 현황에서 업무로 직접 연결되는 링크가 없어 진행 중인 자료요청 업무의 취소
      및 취소 사유 기록은 이 Action으로 처리할 수 없다.
    target: DocumentSubmission
    parameters:
      reason:
        type: string
        required: true
        description: 자료 요청 취소 사유. 이 Action에서는 저장할 수 없다.
    preconditions:
    - message: 자료수집중인 신고의 요청됨 상태 자료만 취소할 수 있습니다.
      check:
        all:
        - field: tax_return.status
          op: eq
          value: 자료수집중
        - field: status
          op: eq
          value: 요청됨
    permission:
      roles:
      - 세무사
      - 실무자
      actor_types:
      - human
    edits:
    - update: target
      set:
        status: 미요청
    emits: []
  transitions:
  - object_type: DocumentSubmission
    from:
    - 요청됨
    to: 미요청
  task: 자료 요청 취소
  qa:
  - Q039
  - Q040
  - Q041
  - Q042
  - Q043
  - Q044
  - Q046
  - Q047
record_document_receipt:
  definition:
    display_name: 자료 접수
    description: 받은 자료의 접수를 기록한다.
    target: DocumentSubmission
    parameters: {}
    preconditions:
    - message: 신고가 자료수집중일 때만 자료 접수를 기록할 수 있습니다.
      check:
        field: tax_return.status
        op: eq
        value: 자료수집중
    permission:
      roles:
      - 세무사
      - 실무자
      actor_types:
      - human
    edits:
    - update: target
      set:
        status: 제출완료
        submitted_at: $today
    emits: []
  transitions:
  - object_type: DocumentSubmission
    from:
    - 미요청
    - 요청됨
    to: 제출완료
  task: 자료 접수
  qa:
  - Q048
  - Q049
  - Q050
  - Q051
  - Q052
start_tax_return_review:
  definition:
    display_name: 신고서 검토 시작
    description: 필수 자료가 정리된 신고의 검토를 시작하고 자료요청 업무를 완료한다. 신고서검토 업무는 필수 속성인 due_date의
      값이 지정되지 않아 생성하지 않는다.
    target: TaxReturn
    parameters: {}
    preconditions:
    - message: 자료수집중인 신고만 검토를 시작할 수 있습니다.
      check:
        field: status
        op: eq
        value: 자료수집중
    - message: 필요한 자료 유형의 자료 현황이 모두 등록되어 있어야 합니다.
      check:
        function: documents_registered
        args:
          tax_return: $target.return_id
    - message: 모든 자료가 제출완료 또는 해당없음으로 정리되어 있어야 합니다.
      check:
        none:
          link: submissions
          where:
            field: status
            op: not_in
            value:
            - 제출완료
            - 해당없음
    permission:
      roles:
      - 시스템
      actor_types:
      - system
    edits:
    - update: target
      set:
        status: 검토중
    - update_linked: tasks
      where:
        all:
        - field: task_type
          op: eq
          value: 자료요청
        - field: status
          op: in
          value:
          - 대기
          - 진행중
      set:
        status: 완료
    emits: []
  transitions:
  - object_type: TaxReturn
    from:
    - 자료수집중
    to: 검토중
  - object_type: Task
    from:
    - 대기
    - 진행중
    to: 완료
  task: 신고서 검토 시작
  qa:
  - Q058
  - Q059
  - Q060
  - Q061
  - Q062
  - Q064
return_to_document_collection:
  definition:
    display_name: 신고 자료수집 단계 복귀
    description: 검토 중 자료가 부족하거나 누락된 신고를 자료수집 단계로 되돌리고, 복귀 이유를 고객연락 업무에 남긴다.
    target: TaxReturn
    parameters:
      reason:
        type: string
        required: true
        description: 자료수집 단계로 복귀하는 이유
      due_date:
        type: date
        required: true
        description: 고객연락 업무의 기한
    preconditions:
    - message: 검토 중인 신고만 자료수집 단계로 되돌릴 수 있습니다.
      check:
        field: status
        op: eq
        value: 검토중
    - message: 자료가 부족하거나 누락된 신고만 자료수집 단계로 되돌릴 수 있습니다.
      check:
        any:
        - some:
            link: submissions
            where:
              field: status
              op: in
              value:
              - 미요청
              - 요청됨
        - not:
            function: documents_registered
            args:
              tax_return: $target.return_id
    permission:
      roles:
      - 세무사
      actor_types:
      - human
    edits:
    - update: target
      set:
        status: 자료수집중
    - update_linked: tasks
      where:
        all:
        - field: task_type
          op: eq
          value: 신고서검토
        - field: status
          op: eq
          value: 진행중
      set:
        status: 취소
    - create: Task
      values:
        customer_id: $target.customer_id
        return_id: $target.return_id
        task_type: 고객연락
        assignee_id: $target.customer.accountant_id
        status: 대기
        due_date: $params.due_date
        created_by: $actor.type
        created_at: $now
        note: $params.reason
    emits: []
  transitions:
  - object_type: TaxReturn
    from:
    - 검토중
    to: 자료수집중
  - object_type: Task
    from:
    - 진행중
    to: 취소
  task: 신고 자료수집 단계 복귀
  qa:
  - Q065
  - Q070
  - Q112
  - Q117
complete_tax_filing:
  definition:
    display_name: 신고 완료 처리
    description: 검토 중인 신고를 기한 내 신고완료로 처리하고 남아 있는 신고서검토 업무를 완료한다.
    target: TaxReturn
    parameters: {}
    preconditions:
    - message: 검토 중인 신고만 완료 처리할 수 있습니다.
      check:
        field: status
        op: eq
        value: 검토중
    - message: 미제출 자료가 없어야 합니다.
      check:
        none:
          link: submissions
          where:
            field: status
            op: in
            value:
            - 미요청
            - 요청됨
    - message: 신고 기한이 지나지 않아야 합니다.
      check:
        field: due_date
        op: gte
        value: $today
    permission:
      roles:
      - 세무사
      actor_types:
      - human
    edits:
    - update: target
      set:
        status: 신고완료
        filed_at: $today
    - update_linked: tasks
      where:
        all:
        - field: task_type
          op: eq
          value: 신고서검토
        - field: status
          op: in
          value:
          - 대기
          - 진행중
      set:
        status: 완료
    emits: []
  transitions:
  - object_type: TaxReturn
    from:
    - 검토중
    to: 신고완료
  - object_type: Task
    from:
    - 대기
    - 진행중
    to: 완료
  task: 신고 완료 처리
  qa:
  - Q071
  - Q072
  - Q073
  - Q074
  - Q075
  - Q076
  - Q077
  - Q079
  - Q118
process_late_filing:
  definition:
    display_name: 기한후신고 처리
    description: 기한이 지난 검토 중 신고를 기한후신고로 처리하고 남아 있는 신고서검토 업무를 완료한다.
    target: TaxReturn
    parameters: {}
    preconditions:
    - message: 신고가 검토중이어야 합니다.
      check:
        field: status
        op: eq
        value: 검토중
    - message: 신고 기한이 지나야 합니다.
      check:
        field: due_date
        op: lt
        value: $today
    permission:
      roles:
      - 세무사
      actor_types:
      - human
    edits:
    - update: target
      set:
        status: 기한후신고
        filed_at: $today
    - update_linked: tasks
      where:
        all:
        - field: task_type
          op: eq
          value: 신고서검토
        - field: status
          op: in
          value:
          - 대기
          - 진행중
      set:
        status: 완료
    emits: []
  transitions:
  - object_type: TaxReturn
    from:
    - 검토중
    to: 기한후신고
  - object_type: Task
    from:
    - 대기
    - 진행중
    to: 완료
  task: 기한후신고 처리
  qa:
  - Q077
  - Q080
  - Q081
  - Q082
  - Q083
  - Q084
  - Q085
  - Q087
  - Q118
  - Q119
  - Q124
escalate_inquiry:
  definition:
    display_name: 문의 전달
    description: 휴업·폐업 고객의 문의 또는 세액·가산세 계산 문의를 담당자에게 전달한다. 폐업 고객의 문의를 전달하면 고객연락 업무를
      생성한다.
    target: Inquiry
    parameters: {}
    preconditions:
    - message: 휴업 또는 폐업 고객의 문의이거나 세액 또는 가산세 계산 문의여야 합니다.
      check:
        any:
        - field: customer.business_status
          op: in
          value:
          - 휴업
          - 폐업
        - field: category
          op: eq
          value: 세금계산
    permission:
      roles:
      - AI비서
      actor_types:
      - agent
    edits:
    - update: target
      set:
        status: 담당자확인
    emits: []
  transitions:
  - object_type: Inquiry
    from:
    - 접수
    - 담당자확인
    to: 담당자확인
  task: 문의 전달
  qa:
  - Q096
  - Q097
  - Q098
  - Q103
answer_inquiry:
  definition:
    display_name: 문의 답변
    description: AI비서가 일반 안내 문의에 답변하고 답변 내용을 기록한다. 가산세 계산 문의 여부는 제공된 속성만으로 판별할 수 없다.
    target: Inquiry
    parameters:
      answer:
        type: string
        required: true
        description: 문의에 대한 답변 내용
    preconditions:
    - message: 세금 계산 문의는 담당자가 답변해야 합니다.
      check:
        field: category
        op: ne
        value: 세금계산
    - message: 담당자에게 전달된 문의는 담당자가 답변해야 합니다.
      check:
        field: status
        op: ne
        value: 담당자확인
    permission:
      roles:
      - AI비서
      actor_types:
      - agent
    edits:
    - update: target
      set:
        status: 답변완료
        answer: $params.answer
        answered_by: $actor.id
        answered_at: $now
    emits: []
  transitions:
  - object_type: Inquiry
    from:
    - 접수
    to: 답변완료
  task: 문의 답변
  qa:
  - Q104
  - Q105
  - Q106
  - Q107
  - Q108
  - Q111
