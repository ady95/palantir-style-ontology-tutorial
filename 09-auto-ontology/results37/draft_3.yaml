assign_accountant:
  definition:
    display_name: 담당자 배정
    description: 고객의 담당자를 배정하거나 변경하고 완료된 담당자배정 업무를 남긴다.
    target: Customer
    parameters:
      accountant:
        type: object
        object_type: Accountant
        required: true
        description: 배정받는 담당자
      due_date:
        type: date
        required: true
        description: 담당자배정 업무의 기한
    preconditions:
    - message: 담당 고객 수가 상한에 도달한 담당자에게는 배정할 수 없습니다.
      check:
        function: has_capacity
        args:
          accountant: $params.accountant
    - message: 현재 담당자를 다시 배정할 수 없습니다.
      check:
        field: accountant_id
        op: ne
        value: $params.accountant
    permission:
      roles:
      - 세무사
      actor_types:
      - human
    edits:
    - update: target
      set:
        accountant_id: $params.accountant
    - create: Task
      values:
        customer_id: $target.customer_id
        task_type: 담당자배정
        assignee_id: $params.accountant
        status: 완료
        due_date: $params.due_date
        created_by: $actor.type
        created_at: $now
    emits: []
  transitions: []
  task: 담당자 배정
  qa:
  - Q001
  - Q002
  - Q003
  - Q004
  - Q005
  - Q007
  - Q124
  - Q125
  - Q126
  - Q127
register_customer_business_type:
  definition:
    display_name: 고객 사업자 유형 등록
    description: 고객의 사업자 유형을 등록한다.
    target: Customer
    parameters:
      business_type:
        type: enum
        values:
        - 개인
        - 법인
        required: true
      vat_type:
        type: enum
        values:
        - 일반과세자
        - 간이과세자
        required: true
    preconditions:
    - message: 법인 고객은 간이과세자로 등록할 수 없습니다.
      check:
        not:
          all:
          - field: $params.business_type
            op: eq
            value: 법인
          - field: $params.vat_type
            op: eq
            value: 간이과세자
    permission:
      roles: []
      actor_types: []
    edits:
    - update: target
      set:
        business_type: $params.business_type
        vat_type: $params.vat_type
    emits: []
  transitions: []
  task: 고객 사업자 유형 등록
  qa:
  - Q011
change_risk_level:
  definition:
    display_name: 위험 등급 변경
    description: 고객의 신고 지연 위험 등급을 변경한다. 변경 이유를 입력받지만, 객체 모델에 이유를 저장할 속성이 없어 기록 효과는
      구현할 수 없다.
    target: Customer
    parameters:
      risk_level:
        type: enum
        values:
        - 낮음
        - 보통
        - 높음
        required: true
        description: 변경할 위험 등급
      reason:
        type: string
        required: true
        description: 위험 등급 변경 이유
    preconditions:
    - message: 변경할 등급은 현재 등급과 달라야 합니다.
      check:
        field: risk_level
        op: ne
        value: $params.risk_level
    permission:
      roles:
      - 세무사
      actor_types:
      - human
    edits:
    - update: target
      set:
        risk_level: $params.risk_level
    emits: []
  transitions: []
  task: 위험 등급 변경
  qa:
  - Q014
  - Q017
  - Q019
request_documents:
  definition:
    display_name: 자료 요청
    description: 신고에 필요한 미요청 자료를 고객에게 요청하고 담당자에게 자료요청 업무를 생성한다. 같은 신고에 대기 또는 진행 중인
      자료요청 업무가 없는지 확인하는 조건은 DocumentSubmission에서 해당 업무 목록으로 직접 연결되는 링크가 없어 적용하지 못한다.
    target: DocumentSubmission
    parameters: {}
    preconditions:
    - message: 자료수집중인 신고에 대해서만 자료를 요청할 수 있습니다.
      check:
        field: tax_return.status
        op: eq
        value: 자료수집중
    - message: 휴업 또는 폐업 고객에게는 자료를 요청하지 않습니다.
      check:
        field: tax_return.customer.business_status
        op: not_in
        value:
        - 휴업
        - 폐업
    - message: 미요청 상태인 자료만 요청할 수 있습니다.
      check:
        field: status
        op: eq
        value: 미요청
    permission:
      roles:
      - 세무사
      - 실무자
      - AI비서
      actor_types:
      - human
      - agent
    approval:
      required_if:
        all:
        - field: $actor.role
          op: eq
          value: AI비서
        - field: tax_return.customer.risk_level
          op: eq
          value: 높음
      approver_roles:
      - 세무사
      reason: AI비서가 위험 등급이 높은 고객에게 자료를 요청합니다.
      expires_in: 24h
    edits:
    - update: target
      set:
        status: 요청됨
        requested_at: $today
    - create: Task
      values:
        customer_id: $target.tax_return.customer_id
        return_id: $target.return_id
        task_type: 자료요청
        assignee_id: $target.tax_return.customer.accountant_id
        status: 대기
        due_date: $target.tax_return.due_date
        created_by: $actor.type
        created_at: $now
    emits: []
  transitions:
  - object_type: DocumentSubmission
    from:
    - 미요청
    to: 요청됨
  task: 자료 요청
  qa:
  - Q020
  - Q021
  - Q022
  - Q023
  - Q024
  - Q025
  - Q026
  - Q027
  - Q028
  - Q029
  - Q030
  - Q031
  - Q034
  - Q098
  - Q099
  - Q100
  - Q101
  - Q104
  - Q105
cancel_document_request:
  definition:
    display_name: 자료 요청 취소
    description: 잘못 보낸 자료 요청을 취소한다. DocumentSubmission에서 신고를 거쳐 진행 중인 자료요청 업무를 수정하는
      다단계 링크는 지원되지 않으므로 해당 업무의 취소 및 사유 기록은 이 Action에서 수행하지 않는다.
    target: DocumentSubmission
    parameters:
      reason:
        type: string
        required: true
        description: 취소 사유
    preconditions:
    - message: 자료수집중인 신고의 자료만 요청을 취소할 수 있습니다.
      check:
        field: tax_return.status
        op: eq
        value: 자료수집중
    - message: 요청됨 상태의 자료만 요청을 취소할 수 있습니다.
      check:
        field: status
        op: eq
        value: 요청됨
    - message: 취소 사유를 입력해야 합니다.
      check:
        field: $params.reason
        op: not_null
    - message: 취소 사유를 입력해야 합니다.
      check:
        field: $params.reason
        op: ne
        value: ''
    permission:
      roles:
      - 세무사
      - 실무자
      actor_types:
      - human
    edits:
    - update: target
      set:
        status: 미요청
    emits: []
  transitions:
  - object_type: DocumentSubmission
    from:
    - 요청됨
    to: 미요청
  task: 자료 요청 취소
  qa:
  - Q035
  - Q036
  - Q038
  - Q039
  - Q041
record_document_receipt:
  definition:
    display_name: 자료 접수 기록
    description: 고객이 보낸 자료의 접수를 기록한다.
    target: DocumentSubmission
    parameters: {}
    preconditions:
    - message: 신고가 자료수집중일 때만 자료 접수를 기록할 수 있습니다.
      check:
        field: tax_return.status
        op: eq
        value: 자료수집중
    permission:
      roles:
      - 세무사
      - 실무자
      actor_types:
      - human
    edits:
    - update: target
      set:
        status: 제출완료
        submitted_at: $today
    emits: []
  transitions:
  - object_type: DocumentSubmission
    from:
    - 미요청
    - 요청됨
    to: 제출완료
  task: 자료 접수 기록
  qa:
  - Q042
  - Q043
  - Q044
  - Q045
start_tax_return_review:
  definition:
    display_name: 신고서 검토 시작
    description: 필수 자료가 정리된 신고의 검토를 시작하고 자료요청 업무를 완료하며 담당자에게 신고서검토 업무를 생성한다.
    target: TaxReturn
    parameters:
      due_date:
        type: date
        required: true
        description: 신고서검토 업무의 기한
    preconditions:
    - message: 자료 현황이 등록되어 있어야 합니다.
      check:
        some:
          link: submissions
          where:
            field: submission_id
            op: not_null
    - message: 필요한 자료 유형의 자료 현황이 모두 등록되어 있어야 합니다.
      check:
        function: documents_registered
        args:
          tax_return: $target.return_id
    - message: 필수 자료가 모두 제출완료 또는 해당없음으로 정리되어야 합니다.
      check:
        none:
          link: submissions
          where:
            field: status
            op: not_in
            value:
            - 제출완료
            - 해당없음
    permission:
      roles:
      - 시스템
      actor_types:
      - system
    edits:
    - update: target
      set:
        status: 검토중
    - update_linked: tasks
      where:
        all:
        - field: task_type
          op: eq
          value: 자료요청
        - field: status
          op: in
          value:
          - 대기
          - 진행중
      set:
        status: 완료
    - create: Task
      values:
        customer_id: $target.customer_id
        return_id: $target.return_id
        task_type: 신고서검토
        assignee_id: $target.customer.accountant_id
        status: 대기
        due_date: $params.due_date
        created_by: $actor.type
        created_at: $now
    emits: []
  transitions:
  - object_type: TaxReturn
    from:
    - 자료수집중
    to: 검토중
  - object_type: Task
    from:
    - 대기
    - 진행중
    to: 완료
  task: 신고서 검토 시작
  qa:
  - Q051
  - Q052
  - Q053
  - Q054
  - Q055
  - Q057
return_to_document_collection:
  definition:
    display_name: 신고 자료수집 단계 복귀
    description: 검토 중 자료 부족이 발견된 신고를 자료수집 단계로 되돌리고, 진행 중인 검토 업무를 취소하며 담당자에게 사유를 기록한
      고객 연락 업무를 생성한다. 고객 연락 업무의 기한은 실행 시 입력한다.
    target: TaxReturn
    parameters:
      reason:
        type: string
        required: true
        description: 검토 중 발견한 자료 부족과 자료수집 단계로 되돌리는 이유
      due_date:
        type: date
        required: true
        description: 고객 연락 업무의 기한
    preconditions:
    - message: 검토 중인 신고만 자료수집 단계로 되돌릴 수 있습니다.
      check:
        field: status
        op: eq
        value: 검토중
    permission:
      roles:
      - 세무사
      actor_types:
      - human
    edits:
    - update: target
      set:
        status: 자료수집중
    - update_linked: tasks
      where:
        all:
        - field: task_type
          op: eq
          value: 신고서검토
        - field: status
          op: eq
          value: 진행중
      set:
        status: 취소
    - create: Task
      values:
        customer_id: $target.customer_id
        return_id: $target.return_id
        task_type: 고객연락
        assignee_id: $target.customer.accountant_id
        status: 대기
        due_date: $params.due_date
        created_by: $actor.type
        created_at: $now
        note: $params.reason
    emits: []
  transitions:
  - object_type: TaxReturn
    from:
    - 검토중
    to: 자료수집중
  - object_type: Task
    from:
    - 진행중
    to: 취소
  task: 신고 자료수집 단계 복귀
  qa:
  - Q058
  - Q062
  - Q064
  - Q106
  - Q111
complete_tax_return:
  definition:
    display_name: 신고 완료 처리
    description: 기한이 지나지 않은 신고를 완료 처리하고 남아 있는 신고서 검토 업무를 완료한다.
    target: TaxReturn
    parameters: {}
    preconditions:
    - message: 검토 중인 신고만 완료할 수 있습니다.
      check:
        field: status
        op: eq
        value: 검토중
    - message: 미제출 자료가 남아 있는 신고는 완료할 수 없습니다.
      check:
        none:
          link: submissions
          where:
            field: status
            op: in
            value:
            - 미요청
            - 요청됨
    - message: 신고 기한이 지난 건은 기한후신고로 처리해야 합니다.
      check:
        field: due_date
        op: gte
        value: $today
    permission:
      roles:
      - 세무사
      actor_types:
      - human
    edits:
    - update: target
      set:
        status: 신고완료
        filed_at: $today
    - update_linked: tasks
      where:
        all:
        - field: task_type
          op: eq
          value: 신고서검토
        - field: status
          op: in
          value:
          - 대기
          - 진행중
      set:
        status: 완료
    emits: []
  transitions:
  - object_type: TaxReturn
    from:
    - 검토중
    to: 신고완료
  - object_type: Task
    from:
    - 대기
    - 진행중
    to: 완료
  task: 신고 완료 처리
  qa:
  - Q065
  - Q066
  - Q067
  - Q068
  - Q069
  - Q070
  - Q071
  - Q073
  - Q118
  - Q123
process_late_filing:
  definition:
    display_name: 기한후신고 처리
    description: 신고 기한이 지난 신고를 기한후신고로 처리하고 남은 신고서검토 업무를 완료한다.
    target: TaxReturn
    parameters: {}
    preconditions:
    - message: 검토중인 신고만 기한후신고로 처리할 수 있습니다.
      check:
        field: status
        op: eq
        value: 검토중
    - message: 신고 기한이 지나야 기한후신고로 처리할 수 있습니다.
      check:
        field: due_date
        op: lt
        value: $today
    permission:
      roles:
      - 세무사
      actor_types:
      - human
    edits:
    - update: target
      set:
        status: 기한후신고
        filed_at: $today
    - update_linked: tasks
      where:
        all:
        - field: task_type
          op: eq
          value: 신고서검토
        - field: status
          op: in
          value:
          - 대기
          - 진행중
      set:
        status: 완료
    emits: []
  transitions:
  - object_type: TaxReturn
    from:
    - 검토중
    to: 기한후신고
  - object_type: Task
    from:
    - 대기
    - 진행중
    to: 완료
  task: 기한후신고 처리
  qa:
  - Q071
  - Q074
  - Q075
  - Q076
  - Q077
  - Q078
  - Q079
  - Q081
  - Q118
  - Q123
escalate_inquiry:
  definition:
    display_name: 문의 전달
    description: 고객 문의를 담당자에게 전달한다.
    target: Inquiry
    parameters: {}
    preconditions: []
    permission:
      roles:
      - AI비서
      actor_types:
      - agent
    edits:
    - update: target
      set:
        status: 담당자확인
    emits: []
  transitions:
  - object_type: Inquiry
    from:
    - 접수
    to: 담당자확인
  task: 문의 전달
  qa:
  - Q082
  - Q083
  - Q084
  - Q089
  - Q112
  - Q117
answer_inquiry:
  definition:
    display_name: 문의 답변
    description: 고객 문의에 답변하고 답변 내용, 답변자, 답변 시각을 기록한다.
    target: Inquiry
    parameters:
      answer:
        type: string
        required: true
        description: 문의 답변 내용
    preconditions:
    - message: 세금 계산 문의는 AI비서가 답변할 수 없습니다.
      check:
        any:
        - field: $actor.type
          op: ne
          value: agent
        - field: category
          op: ne
          value: 세금계산
    - message: 담당자에게 넘어간 문의와 세금 계산 문의는 담당자가 직접 답변해야 합니다.
      check:
        any:
        - all:
          - field: status
            op: ne
            value: 담당자확인
          - field: category
            op: ne
            value: 세금계산
        - all:
          - field: $actor.type
            op: eq
            value: human
          - field: customer.accountant_id
            op: eq
            value: $actor.id
    permission:
      roles:
      - AI비서
      - 세무사
      - 실무자
      actor_types:
      - agent
      - human
    edits:
    - update: target
      set:
        status: 답변완료
        answer: $params.answer
        answered_by: $actor.id
        answered_at: $now
    emits: []
  transitions:
  - object_type: Inquiry
    from:
    - 접수
    - 담당자확인
    to: 답변완료
  task: 문의 답변
  qa:
  - Q090
  - Q091
  - Q092
  - Q093
  - Q094
  - Q097
