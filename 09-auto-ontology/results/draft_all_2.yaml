assign_customer_accountant:
  definition:
    display_name: 고객 담당자 배정
    description: 새 고객에게 담당 실무자를 배정하거나 기존 담당자를 변경한다. 배정 대상이 실무자인지 확인할 수 있는 Function이
      없어 해당 조건은 검사하지 않는다.
    target: Customer
    parameters:
      accountant:
        type: object
        object_type: Accountant
        required: true
        description: 배정할 실무자
      due_date:
        type: date
        required: true
        description: 담당자 배정 업무의 기한
    preconditions:
    - message: 담당 고객 수가 최대치에 도달한 실무자에게는 배정할 수 없습니다.
      check:
        function: has_capacity
        args:
          accountant: $params.accountant
    - message: 현재 담당자를 다시 배정할 수 없습니다.
      check:
        field: accountant_id
        op: ne
        value: $params.accountant
    permission:
      roles:
      - 세무사
      actor_types:
      - human
    edits:
    - update: target
      set:
        accountant_id: $params.accountant
    - create: Task
      values:
        customer_id: $target.customer_id
        task_type: 담당자배정
        assignee_id: $params.accountant
        status: 완료
        due_date: $params.due_date
        created_by: $actor.type
        created_at: $now
    emits: []
  transitions: []
change_filing_delay_risk_level:
  definition:
    display_name: 신고 지연 위험 등급 변경
    description: 고객의 신고 지연 위험 등급을 변경한다. 변경 이유는 필수 입력이지만 객체 모델에 기록할 속성이 없어 저장할 수 없다.
    target: Customer
    parameters:
      risk_level:
        type: enum
        values:
        - 낮음
        - 보통
        - 높음
        required: true
        description: 변경할 신고 지연 위험 등급
      reason:
        type: string
        required: true
        description: 등급 변경 이유
    preconditions:
    - message: 현재와 다른 위험 등급을 선택해야 합니다.
      check:
        field: risk_level
        op: ne
        value: $params.risk_level
    permission:
      roles:
      - 세무사
      actor_types:
      - human
    edits:
    - update: target
      set:
        risk_level: $params.risk_level
    emits: []
  transitions: []
request_document:
  definition:
    display_name: 자료 요청
    description: 신고에 필요한 미요청 자료를 고객에게 발송 요청하고 담당자의 자료요청 업무를 생성한다. 같은 신고에 대기 또는 진행중인
      자료요청 업무가 없어야 하나, 현재 문법으로 연결된 신고의 업무 목록을 검사할 수 없어 해당 조건은 적용하지 못한다.
    target: DocumentSubmission
    parameters: {}
    preconditions:
    - message: 자료수집중인 신고의 자료만 요청할 수 있습니다.
      check:
        field: tax_return.status
        op: eq
        value: 자료수집중
    - message: 휴업 또는 폐업 고객에게는 자료를 요청할 수 없습니다.
      check:
        field: tax_return.customer.business_status
        op: not_in
        value:
        - 휴업
        - 폐업
    - message: 아직 요청하지 않은 자료만 요청할 수 있습니다.
      check:
        field: status
        op: eq
        value: 미요청
    permission:
      roles:
      - 세무사
      - 실무자
      - AI비서
      actor_types:
      - human
      - agent
    approval:
      required_if:
        all:
        - field: $actor.role
          op: eq
          value: AI비서
        - field: tax_return.customer.risk_level
          op: eq
          value: 높음
      approver_roles:
      - 세무사
      reason: 고위험 고객에 대한 AI 비서의 자료 요청은 사람인 세무사의 승인이 필요합니다.
      expires_in: 24h
    edits:
    - update: target
      set:
        status: 요청됨
        requested_at: $today
    - create: Task
      values:
        customer_id: $target.tax_return.customer_id
        return_id: $target.return_id
        task_type: 자료요청
        assignee_id: $target.tax_return.customer.accountant_id
        status: 대기
        due_date: $target.tax_return.due_date
        created_by: $actor.type
        created_at: $now
    emits: []
  transitions:
  - object_type: DocumentSubmission
    from:
    - 미요청
    to: 요청됨
cancel_document_request:
  definition:
    display_name: 자료 요청 취소
    description: 잘못 보낸 자료 요청을 취소한다. 관련 자료요청 업무에 취소 사유를 기록하는 작업은 DocumentSubmission에서
      Task로 직접 연결되는 링크가 없어 이 Action에 포함할 수 없다.
    target: DocumentSubmission
    parameters:
      reason:
        type: string
        required: true
        description: 자료 요청 취소 사유
    preconditions:
    - message: 자료수집중인 신고의 자료 요청만 취소할 수 있습니다.
      check:
        field: tax_return.status
        op: eq
        value: 자료수집중
    - message: 요청됨 상태의 자료만 요청을 취소할 수 있습니다.
      check:
        field: status
        op: eq
        value: 요청됨
    - message: 취소 사유를 입력해 주세요.
      check:
        field: $params.reason
        op: ne
        value: ''
    permission:
      roles:
      - 세무사
      - 실무자
      actor_types:
      - human
    edits:
    - update: target
      set:
        status: 미요청
    emits: []
  transitions:
  - object_type: DocumentSubmission
    from:
    - 요청됨
    to: 미요청
record_document_receipt:
  definition:
    display_name: 자료 접수 기록
    description: 고객에게서 받은 자료의 접수를 시스템에 기록한다. 고객에게서 자료를 받았는지 여부는 객체 모델에서 확인할 수 없다.
    target: DocumentSubmission
    parameters: {}
    preconditions:
    - message: 신고 상태가 자료수집중인 경우에만 접수를 기록합니다.
      check:
        field: tax_return.status
        op: eq
        value: 자료수집중
    permission:
      roles:
      - 세무사
      - 실무자
      actor_types:
      - human
    edits:
    - update: target
      set:
        status: 제출완료
        submitted_at: $today
    emits: []
  transitions:
  - object_type: DocumentSubmission
    from:
    - 미요청
    - 요청됨
    to: 제출완료
start_tax_return_review:
  definition:
    display_name: 신고서 검토 시작
    description: 신고를 검토중으로 전환하고 대기 또는 진행중인 자료요청 업무를 완료하며 담당자에게 신고서검토 업무를 만든다. 신고서검토
      업무의 기한은 매개변수로 입력한다.
    target: TaxReturn
    parameters:
      due_date:
        type: date
        required: true
        description: 신고서검토 업무의 기한
    preconditions:
    - message: 자료수집중인 신고만 검토를 시작할 수 있습니다.
      check:
        field: status
        op: eq
        value: 자료수집중
    - message: 필수 자료가 모두 제출완료 또는 해당없음 상태여야 합니다.
      check:
        none:
          link: submissions
          where:
            field: status
            op: not_in
            value:
            - 제출완료
            - 해당없음
    - message: 필요한 자료 유형의 자료 현황이 등록되어 있어야 합니다.
      check:
        function: documents_registered
        args:
          tax_return: $target.return_id
    permission:
      roles:
      - 시스템
      actor_types:
      - system
    edits:
    - update: target
      set:
        status: 검토중
    - update_linked: tasks
      where:
        all:
        - field: task_type
          op: eq
          value: 자료요청
        - field: status
          op: in
          value:
          - 대기
          - 진행중
      set:
        status: 완료
    - create: Task
      values:
        customer_id: $target.customer_id
        return_id: $target.return_id
        task_type: 신고서검토
        assignee_id: $target.customer.accountant_id
        status: 대기
        due_date: $params.due_date
        created_by: $actor.type
        created_at: $now
    emits: []
  transitions:
  - object_type: TaxReturn
    from:
    - 자료수집중
    to: 검토중
  - object_type: Task
    from:
    - 대기
    - 진행중
    to: 완료
return_to_document_collection:
  definition:
    display_name: 자료수집 단계로 되돌리기
    description: 자료가 부족한 신고를 자료수집 단계로 되돌리고, 진행 중인 검토 업무를 취소하며 담당자의 고객 연락 업무에 이유를 기록한다.
    target: TaxReturn
    parameters:
      reason:
        type: string
        required: true
        description: 자료수집 단계로 되돌리는 이유
      due_date:
        type: date
        required: true
        description: 고객 연락 업무의 기한
    preconditions:
    - message: 검토 중인 신고만 자료수집 단계로 되돌릴 수 있습니다.
      check:
        field: status
        op: eq
        value: 검토중
    - message: 미제출 자료가 있는 신고만 자료수집 단계로 되돌릴 수 있습니다.
      check:
        some:
          link: submissions
          where:
            field: status
            op: in
            value:
            - 미요청
            - 요청됨
    permission:
      roles:
      - 세무사
      actor_types:
      - human
    edits:
    - update: target
      set:
        status: 자료수집중
    - update_linked: tasks
      where:
        all:
        - field: task_type
          op: eq
          value: 신고서검토
        - field: status
          op: eq
          value: 진행중
      set:
        status: 취소
    - create: Task
      values:
        customer_id: $target.customer_id
        return_id: $target.return_id
        task_type: 고객연락
        assignee_id: $target.customer.accountant_id
        status: 대기
        due_date: $params.due_date
        created_by: $actor.type
        created_at: $now
        note: $params.reason
    emits: []
  transitions:
  - object_type: TaxReturn
    from:
    - 검토중
    to: 자료수집중
  - object_type: Task
    from:
    - 진행중
    to: 취소
complete_tax_filing:
  definition:
    display_name: 신고 완료 처리
    description: 검토 중인 신고를 신고완료로 처리하고 남아 있는 신고서검토 업무를 완료한다.
    target: TaxReturn
    parameters: {}
    preconditions:
    - message: 검토 중인 신고만 완료 처리할 수 있습니다.
      check:
        field: status
        op: eq
        value: 검토중
    - message: 제출되지 않은 자료가 있으면 신고를 완료할 수 없습니다.
      check:
        none:
          link: submissions
          where:
            field: status
            op: in
            value:
            - 미요청
            - 요청됨
    - message: 신고 기한이 지나면 기한후신고로 처리해야 합니다.
      check:
        field: due_date
        op: gte
        value: $today
    permission:
      roles:
      - 세무사
      actor_types:
      - human
    edits:
    - update: target
      set:
        status: 신고완료
        filed_at: $today
    - update_linked: tasks
      where:
        all:
        - field: task_type
          op: eq
          value: 신고서검토
        - field: status
          op: in
          value:
          - 대기
          - 진행중
      set:
        status: 완료
    emits: []
  transitions:
  - object_type: TaxReturn
    from:
    - 검토중
    to: 신고완료
  - object_type: Task
    from:
    - 대기
    - 진행중
    to: 완료
process_late_filing:
  definition:
    display_name: 기한후신고 처리
    description: 신고 기한이 지난 신고를 기한후신고로 처리하고 신고일을 기록한다.
    target: TaxReturn
    parameters: {}
    preconditions:
    - message: 신고 기한이 지나야 기한후신고로 처리할 수 있습니다.
      check:
        field: due_date
        op: lt
        value: $today
    - message: 검토 중인 신고만 기한후신고로 처리할 수 있습니다.
      check:
        field: status
        op: eq
        value: 검토중
    permission:
      roles:
      - 세무사
      actor_types:
      - human
    edits:
    - update: target
      set:
        status: 기한후신고
        filed_at: $today
    emits: []
  transitions:
  - object_type: TaxReturn
    from:
    - 검토중
    to: 기한후신고
answer_inquiry:
  definition:
    display_name: 문의 답변
    description: 고객 문의에 답변하고 답변 완료로 처리한다.
    target: Inquiry
    parameters:
      answer:
        type: string
        required: true
        description: 문의에 대한 답변 내용
    preconditions: []
    permission:
      roles:
      - AI비서
      - 세무사
      - 실무자
      actor_types:
      - agent
      - human
      check:
        all:
        - any:
          - field: category
            op: ne
            value: 세금계산
          - all:
            - field: $actor.type
              op: eq
              value: human
            - field: customer.accountant_id
              op: eq
              value: $actor.id
        - any:
          - field: status
            op: ne
            value: 담당자확인
          - all:
            - field: $actor.type
              op: eq
              value: human
            - field: customer.accountant_id
              op: eq
              value: $actor.id
    edits:
    - update: target
      set:
        answer: $params.answer
        answered_by: $actor.id
        answered_at: $now
        status: 답변완료
    emits: []
  transitions:
  - object_type: Inquiry
    from:
    - 접수
    to: 답변완료
escalate_inquiry:
  definition:
    display_name: 문의 담당자 전달
    description: 고객 문의를 담당자 확인 상태로 변경한다. 제공된 모델과 문법으로는 담당자에게 실제로 전달하는 동작을 표현할 수 없다.
    target: Inquiry
    parameters: {}
    preconditions: []
    permission:
      roles:
      - AI비서
      actor_types:
      - agent
    edits:
    - update: target
      set:
        status: 담당자확인
    emits: []
  transitions:
  - object_type: Inquiry
    from:
    - 접수
    to: 담당자확인
